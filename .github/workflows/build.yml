name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

env:
  APP_NAME: ShutdownTimer
  ENTRYPOINT: ShutDownPC.py
  ICON_FILE: icon.ico

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      # --- Version from tag / fallback for manual runs ---
      - name: Set version
        shell: bash
        run: |
          BASE_VERSION="$(python -c "from app_meta import APP_VERSION; print(APP_VERSION)")"
          echo "BASE_VERSION=${BASE_VERSION}" >> $GITHUB_ENV

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"

            if [[ "${VERSION}" != "${BASE_VERSION}" ]]; then
              echo "Tag version ${VERSION} does not match app version ${BASE_VERSION}" >&2
              exit 1
            fi

            echo "TAG_NAME=${TAG}" >> $GITHUB_ENV
            echo "APP_VERSION=${VERSION}" >> $GITHUB_ENV
            echo "RELEASE_MODE=true" >> $GITHUB_ENV
          else
            SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
            echo "TAG_NAME=manual-${SHORT_SHA}" >> $GITHUB_ENV
            echo "APP_VERSION=${BASE_VERSION}-dev-${SHORT_SHA}" >> $GITHUB_ENV
            echo "RELEASE_MODE=false" >> $GITHUB_ENV
          fi

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install pyinstaller

      # -------- BUILD (Windows) --------
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          python packaging/build_release.py --clean --version "${{ env.APP_VERSION }}"

          Compress-Archive -Force `
            "dist/${{ env.APP_NAME }}-${{ env.APP_VERSION }}.exe" `
            "dist/${{ env.APP_NAME }}-${{ env.APP_VERSION }}-windows.zip"

      # -------- BUILD (Linux) --------
      - name: Build (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python packaging/build_release.py --clean --version "${APP_VERSION}"

          cd dist
          zip -j "${APP_NAME}-${APP_VERSION}-linux.zip" "${APP_NAME}-${APP_VERSION}"

      # -------- BUILD (macOS) --------
      - name: Build (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          pyinstaller --noconfirm --windowed \
            --name "${APP_NAME}-${APP_VERSION}" \
            --add-data "${ICON_FILE}:." \
            "${ENTRYPOINT}"

          cd dist
          ditto -c -k --sequesterRsrc --keepParent \
            "${APP_NAME}-${APP_VERSION}.app" \
            "${APP_NAME}-${APP_VERSION}-macos.zip"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ env.APP_VERSION }}-${{ runner.os }}
          path: |
            dist/*.zip

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List files
        shell: bash
        run: ls -R artifacts

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            artifacts/**/*.zip
